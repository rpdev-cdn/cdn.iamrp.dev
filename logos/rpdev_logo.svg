<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0914" />
      <stop offset="100%" stop-color="#161324" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fafd7" />
      <stop offset="100%" stop-color="#00afaf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Octagon -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg-grad)" stroke="url(#cyan-glow)" stroke-width="8" />

  <!-- Inner Cyber Grid Accent -->
  <path d="M128 40 L256 160 L384 40" fill="none" stroke="#00afaf" stroke-width="3" stroke-opacity="0.3" />
  <path d="M128 472 L256 352 L384 472" fill="none" stroke="#00afaf" stroke-width="3" stroke-opacity="0.3" />

  <!-- RP Monogram / Terminal Node Logo -->
  <g filter="url(#glow)">
    <!-- Terminal Prompt Carat -->
    <path d="M120 180 L180 256 L120 332" fill="none" stroke="url(#cyan-glow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Shield Nodes -->
    <circle cx="256" cy="140" r="14" fill="#5fafd7" />
    <circle cx="340" cy="200" r="14" fill="#00afaf" />
    <circle cx="340" cy="312" r="14" fill="#00afaf" />
    <circle cx="256" cy="372" r="14" fill="#5fafd7" />

    <!-- Connecting Bus Lines -->
    <path d="M256 140 L340 200 L340 312 L256 372" fill="none" stroke="url(#cyan-glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M256 140 L256 372" fill="none" stroke="#00afaf" stroke-width="8" stroke-dasharray="16 12" />

    <!-- Terminal Cursor Underline -->
    <line x1="200" y1="332" x2="280" y2="332" stroke="#5fafd7" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Text Label -->
  <text x="256" y="440" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="800" fill="#e2e1e8" text-anchor="middle" letter-spacing="8">RPDEV</text>
</svg>
