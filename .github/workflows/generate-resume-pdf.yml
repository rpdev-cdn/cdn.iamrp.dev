name: Auto-Generate & Optimize Resume PDF

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/generate-resume-pdf.yml'
  repository_dispatch:
    types: [ "resume-updated", "sync-resume-pdf" ]
  workflow_dispatch:
  schedule:
    # Daily synchronization check at 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build-and-sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CDN Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Source iamrp.dev Repository
        uses: actions/checkout@v4
        with:
          repository: rpdev-cdn/iamrp.dev
          path: 'iamrp-source'
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pure-Python PDF Toolchain
        run: |
          pip install markdown weasyprint pypdf

      - name: Generate & Optimize Resume PDF via Pure Python
        run: |
          python3 iamrp-source/scripts/build_resume_pdf.py

      - name: Commit and Push Updated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(pdf): auto-generate and optimize resume PDF via pure-python weasyprint + pypdf"
          branch: main
          file_pattern: 'pdf/Richard_Dissell_Resume.pdf'
