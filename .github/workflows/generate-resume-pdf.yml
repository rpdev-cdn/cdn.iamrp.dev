name: Auto-Generate & Optimize Resume PDF

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/generate-resume-pdf.yml'
  repository_dispatch:
    types: [ "resume-updated", "sync-resume-pdf" ]
  workflow_dispatch:
  schedule:
    # Daily synchronization check at 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build-and-sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CDN Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Source iamrp.dev Repository
        uses: actions/checkout@v4
        with:
          repository: rpdev-cdn/iamrp.dev
          path: 'iamrp-source'
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd iamrp-source
          npm ci
          npm install puppeteer
          cd ..
          pip install pypdf

      - name: Build Quartz Site
        working-directory: ./iamrp-source
        run: |
          npx quartz build

      - name: Generate High-Fidelity PDF & Optimize with pypdf
        run: |
          python3 -c "
          import os
          import sys
          import subprocess
          import threading
          import http.server
          import socketserver
          import pypdf

          PORT = 8768
          PUBLIC_DIR = os.path.abspath('iamrp-source/public')
          CDN_PDF_DIR = os.path.abspath('pdf')
          OUTPUT_PDF = os.path.join(CDN_PDF_DIR, 'Richard_Dissell_Resume.pdf')
          os.makedirs(CDN_PDF_DIR, exist_ok=True)

          class CleanUrlHandler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=PUBLIC_DIR, **kwargs)

              def translate_path(self, path):
                  translated = super().translate_path(path)
                  if not os.path.exists(translated):
                      if os.path.exists(translated + '.html'):
                          return translated + '.html'
                      dir_name = os.path.dirname(translated)
                      base_name = os.path.basename(translated).lower()
                      if os.path.exists(dir_name):
                          for f in os.listdir(dir_name):
                              if f.lower() == base_name or f.lower() == base_name + '.html':
                                  return os.path.join(dir_name, f)
                  return translated

              def log_message(self, format, *args):
                  pass

          print(f'[*] Starting local server on port {PORT}...')
          httpd = socketserver.TCPServer(('127.0.0.1', PORT), CleanUrlHandler)
          threading.Thread(target=httpd.serve_forever, daemon=True).start()

          temp_raw_pdf = os.path.join(PUBLIC_DIR, 'raw_resume.pdf')
          node_render_script = f'''
          const puppeteer = require('puppeteer');
          (async () => {{
            const browser = await puppeteer.launch({{
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-gpu']
            }});
            const page = await browser.newPage();
            await page.setViewport({{ width: 1200, height: 1600 }});
            await page.goto('http://127.0.0.1:{PORT}/resume/master_resume', {{ waitUntil: 'networkidle0' }});
            await page.evaluate(() => {{
              const hideSelectors = ['.sidebar', '.page-header', 'footer', '.toc', '.breadcrumb-container', '.footer-git-info', '.backlinks', '.graph'];
              hideSelectors.forEach(selector => {{
                document.querySelectorAll(selector).forEach(el => el.style.display = 'none');
              }});
              const center = document.querySelector('.center');
              if (center) {{
                center.style.maxWidth = '100%';
                center.style.width = '100%';
                center.style.margin = '0';
                center.style.padding = '20px';
              }}
            }});
            await page.pdf({{
              path: '{temp_raw_pdf}',
              format: 'Letter',
              printBackground: true,
              margin: {{ top: '0.4in', right: '0.4in', bottom: '0.4in', left: '0.4in' }}
            }});
            await browser.close();
          }})();
          '''

          print('[*] Rendering Master Resume via Chromium...')
          proc = subprocess.run(['node', '-e', node_render_script], cwd='iamrp-source', capture_output=True, text=True)
          httpd.shutdown()

          if proc.returncode != 0:
              print('[!] Render failed:', proc.stderr)
              sys.exit(1)

          print('[*] Post-processing PDF with pypdf (metadata + stream compression)...')
          reader = pypdf.PdfReader(temp_raw_pdf)
          writer = pypdf.PdfWriter()

          for page in reader.pages:
              writer.add_page(page)

          for page in writer.pages:
              page.compress_content_streams()

          writer.add_metadata({
              '/Title': 'Richard P. Dissell - Master Resume & Curriculum Vitae',
              '/Author': 'Richard P. Dissell',
              '/Subject': 'Security Analysis, Systems Architecture & Infrastructure Engineering',
              '/Keywords': 'Security, Zero Trust, Infrastructure, Linux, Architecture, CI/CD, DevOps',
              '/Creator': 'iamrp.dev Build Engine',
              '/Producer': f'iamrp.dev (pypdf v{pypdf.__version__})'
          })

          with open(OUTPUT_PDF, 'wb') as f:
              writer.write(f)

          print(f'[✓] Successfully optimized PDF at {OUTPUT_PDF} ({os.path.getsize(OUTPUT_PDF) // 1024} KB)')
          "

      - name: Commit and Push Updated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(pdf): auto-generate and optimize resume PDF via pypdf"
          branch: main
          file_pattern: 'pdf/Richard_Dissell_Resume.pdf'
